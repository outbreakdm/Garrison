name: Deploy to Cloudflare

# Runs only when someone with write access presses "Run workflow" in the
# Actions tab. Nothing deploys on push. Secrets and variables are set in
# Settings → Secrets and variables → Actions (see DEPLOY.md).
on:
  workflow_dispatch:
    inputs:
      target:
        description: What to deploy
        type: choice
        options: [everything, dashboard, bot]
        default: everything
      register_commands:
        description: Register slash commands with Discord
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: deploy-cloudflare
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      DISCORD_CLIENT_ID: ${{ vars.DISCORD_CLIENT_ID }}
      APP_URL: ${{ vars.APP_URL }}
      HYPERDRIVE_ID: ${{ vars.HYPERDRIVE_ID }}
      DASHBOARD_DOMAIN: ${{ vars.DASHBOARD_DOMAIN }}
      CF_PLACEMENT_REGION: ${{ vars.CF_PLACEMENT_REGION }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Check that every secret and variable is set
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          DISCORD_CLIENT_SECRET: ${{ secrets.DISCORD_CLIENT_SECRET }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          missing=""
          for v in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID DISCORD_TOKEN DISCORD_CLIENT_SECRET DATABASE_URL DISCORD_CLIENT_ID APP_URL HYPERDRIVE_ID; do
            [ -n "${!v}" ] || missing="$missing $v"
          done
          if [ -n "$missing" ]; then
            echo "::error::Not set in GitHub (Settings → Secrets and variables → Actions):$missing"
            exit 1
          fi

      - name: Preflight (token, intents, database roles, schema)
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          DISCORD_CLIENT_SECRET: ${{ secrets.DISCORD_CLIENT_SECRET }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          WEB_DATABASE_URL: ${{ secrets.WEB_DATABASE_URL }}
        run: pnpm preflight

      - name: Fill in Cloudflare settings
        run: node scripts/cf-config.mjs

      - name: Register slash commands
        if: inputs.register_commands
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
        run: pnpm commands:deploy

      - name: Deploy dashboard
        if: inputs.target != 'bot'
        working-directory: apps/web
        # Cloudflare sometimes can't find a version it has just uploaded (code 100146) for longer
        # than Wrangler waits (workers-sdk #16717). Only that error is retried, after a pause.
        run: |
          set -o pipefail
          for attempt in 1 2 3 4; do
            if pnpm cf:deploy 2>&1 | tee deploy.log; then exit 0; fi
            grep -q "code: 100146" deploy.log || exit 1
            echo "::warning::Cloudflare couldn't find the new version yet (100146); retrying in 30 s ($attempt of 4)"
            sleep 30
          done
          exit 1

      - name: Dashboard secrets
        if: inputs.target != 'bot'
        working-directory: apps/web
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          DISCORD_CLIENT_SECRET: ${{ secrets.DISCORD_CLIENT_SECRET }}
          BNET_CLIENT_ID: ${{ secrets.BNET_CLIENT_ID }}
          BNET_CLIENT_SECRET: ${{ secrets.BNET_CLIENT_SECRET }}
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
          TWITCH_EVENTSUB_SECRET: ${{ secrets.TWITCH_EVENTSUB_SECRET }}
          TURNSTILE_SITE_KEY: ${{ secrets.TURNSTILE_SITE_KEY }}
          TURNSTILE_SECRET: ${{ secrets.TURNSTILE_SECRET }}
          # Billing (optional until checkout opens): see docs/pricing.md, "Turning checkout on".
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          STRIPE_PRICE_PRO_MONTHLY: ${{ secrets.STRIPE_PRICE_PRO_MONTHLY }}
          STRIPE_PRICE_PRO_YEARLY: ${{ secrets.STRIPE_PRICE_PRO_YEARLY }}
          STRIPE_PRICE_AGENCY_MONTHLY: ${{ secrets.STRIPE_PRICE_AGENCY_MONTHLY }}
          STRIPE_PRICE_AGENCY_YEARLY: ${{ secrets.STRIPE_PRICE_AGENCY_YEARLY }}
          BILLING_DATABASE_URL: ${{ secrets.BILLING_DATABASE_URL }}
        run: |
          printf '%s' "$DISCORD_TOKEN" | npx wrangler secret put DISCORD_TOKEN
          printf '%s' "$DISCORD_CLIENT_SECRET" | npx wrangler secret put DISCORD_CLIENT_SECRET
          if [ -n "$BNET_CLIENT_ID" ]; then printf '%s' "$BNET_CLIENT_ID" | npx wrangler secret put BNET_CLIENT_ID; fi
          if [ -n "$BNET_CLIENT_SECRET" ]; then printf '%s' "$BNET_CLIENT_SECRET" | npx wrangler secret put BNET_CLIENT_SECRET; fi
          if [ -n "$TWITCH_CLIENT_ID" ]; then printf '%s' "$TWITCH_CLIENT_ID" | npx wrangler secret put TWITCH_CLIENT_ID; fi
          if [ -n "$TWITCH_CLIENT_SECRET" ]; then printf '%s' "$TWITCH_CLIENT_SECRET" | npx wrangler secret put TWITCH_CLIENT_SECRET; fi
          if [ -n "$TWITCH_EVENTSUB_SECRET" ]; then printf '%s' "$TWITCH_EVENTSUB_SECRET" | npx wrangler secret put TWITCH_EVENTSUB_SECRET; fi
          if [ -n "$TURNSTILE_SITE_KEY" ]; then printf '%s' "$TURNSTILE_SITE_KEY" | npx wrangler secret put TURNSTILE_SITE_KEY; fi
          if [ -n "$TURNSTILE_SECRET" ]; then printf '%s' "$TURNSTILE_SECRET" | npx wrangler secret put TURNSTILE_SECRET; fi
          for v in STRIPE_SECRET_KEY STRIPE_WEBHOOK_SECRET STRIPE_PRICE_PRO_MONTHLY STRIPE_PRICE_PRO_YEARLY STRIPE_PRICE_AGENCY_MONTHLY STRIPE_PRICE_AGENCY_YEARLY BILLING_DATABASE_URL; do
            if [ -n "${!v}" ]; then printf '%s' "${!v}" | npx wrangler secret put "$v"; fi
          done

      - name: Deploy bot (builds the container image)
        if: inputs.target != 'dashboard'
        working-directory: apps/bot-cloudflare
        # Cloudflare sometimes can't find a version it has just uploaded (code 100146) for longer
        # than Wrangler waits (workers-sdk #16717). Only that error is retried, after a pause.
        run: |
          set -o pipefail
          for attempt in 1 2 3 4; do
            if pnpm cf:deploy 2>&1 | tee deploy.log; then exit 0; fi
            grep -q "code: 100146" deploy.log || exit 1
            echo "::warning::Cloudflare couldn't find the new version yet (100146); retrying in 30 s ($attempt of 4)"
            sleep 30
          done
          exit 1

      - name: Bot secrets
        if: inputs.target != 'dashboard'
        working-directory: apps/bot-cloudflare
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
          KICK_CLIENT_ID: ${{ secrets.KICK_CLIENT_ID }}
          KICK_CLIENT_SECRET: ${{ secrets.KICK_CLIENT_SECRET }}
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
          STEAM_API_KEY: ${{ secrets.STEAM_API_KEY }}
          RIOT_API_KEY: ${{ secrets.RIOT_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          printf '%s' "$DISCORD_TOKEN" | npx wrangler secret put DISCORD_TOKEN
          printf '%s' "$DATABASE_URL" | npx wrangler secret put DATABASE_URL
          if [ -n "$ANTHROPIC_API_KEY" ]; then printf '%s' "$ANTHROPIC_API_KEY" | npx wrangler secret put ANTHROPIC_API_KEY; fi
          if [ -n "$TWITCH_CLIENT_ID" ]; then printf '%s' "$TWITCH_CLIENT_ID" | npx wrangler secret put TWITCH_CLIENT_ID; fi
          if [ -n "$TWITCH_CLIENT_SECRET" ]; then printf '%s' "$TWITCH_CLIENT_SECRET" | npx wrangler secret put TWITCH_CLIENT_SECRET; fi
          if [ -n "$KICK_CLIENT_ID" ]; then printf '%s' "$KICK_CLIENT_ID" | npx wrangler secret put KICK_CLIENT_ID; fi
          if [ -n "$KICK_CLIENT_SECRET" ]; then printf '%s' "$KICK_CLIENT_SECRET" | npx wrangler secret put KICK_CLIENT_SECRET; fi
          if [ -n "$REDDIT_CLIENT_ID" ]; then printf '%s' "$REDDIT_CLIENT_ID" | npx wrangler secret put REDDIT_CLIENT_ID; fi
          if [ -n "$REDDIT_CLIENT_SECRET" ]; then printf '%s' "$REDDIT_CLIENT_SECRET" | npx wrangler secret put REDDIT_CLIENT_SECRET; fi
          if [ -n "$STEAM_API_KEY" ]; then printf '%s' "$STEAM_API_KEY" | npx wrangler secret put STEAM_API_KEY; fi
          if [ -n "$RIOT_API_KEY" ]; then printf '%s' "$RIOT_API_KEY" | npx wrangler secret put RIOT_API_KEY; fi
          if [ -n "$OPENAI_API_KEY" ]; then printf '%s' "$OPENAI_API_KEY" | npx wrangler secret put OPENAI_API_KEY; fi

      - name: Done
        run: |
          echo "Dashboard: $APP_URL  (check $APP_URL/healthz and $APP_URL/status)"
          echo "The bot starts within about two minutes; /status turns to 'online'."
